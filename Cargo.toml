[package]
name = "language-bar"
version = "0.2.0"
edition = "2024"

[dependencies]
base64 = "0.22"
resvg = { version = "0.46", default-features = false }
roxmltree = "0.21"
rs-grid-icons = "0.1.3"
x11rb = { version = "0.13", features = ["xkb"] }
xkbcommon = { version = "0.8", default-features = false }
ksni = { version = "0.3.6", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
